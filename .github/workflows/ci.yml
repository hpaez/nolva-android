name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Resolve app.nolva:nolva-core from nolva-core's GitHub Packages. The
  # package must grant this repo read access (Package settings → Manage
  # Actions access).
  packages: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a PR's changed files through the API.
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # A file counts as code unless it matches every exclusion below.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'

  build:
    name: build · lint · unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Also validates the checksum of gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: ./gradlew assembleDebug lintDebug testDebugUnitTest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  # The only check required by branch protection. It always runs and fails
  # if any job failed or was cancelled; skipped jobs (docs-only changes)
  # count as success. Required checks then never get stuck waiting for jobs
  # that were skipped, and renaming jobs doesn't touch protection settings.
  result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
