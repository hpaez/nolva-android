version: 2

# Monthly: each update PR runs the whole CI, and minutes cost money on a
# private repo. Security updates still arrive as soon as they are published.

registries:
  # nolva-core's .aar lives in a private GitHub Packages registry. The token
  # is a Dependabot secret (Settings → Secrets and variables → Dependabot):
  # a classic PAT with only read:packages.
  nolva-core:
    type: maven-repository
    url: https://maven.pkg.github.com/hpaez/nolva-core
    username: hpaez
    password: ${{secrets.NOLVA_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    # Public repositories come from the build files; this adds credentials
    # for the private one.
    registries: "*"
    schedule:
      interval: monthly
    # app.nolva:nolva-core matches no group, so each core release gets its
    # own PR, easy to review on its own.
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-agp:
        patterns: ["org.jetbrains.kotlin*", "com.android.*"]
